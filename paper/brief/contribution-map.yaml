primary_claim:
  statement: >
    FinLens, an end-to-end text-to-pandas pipeline for Vietnamese financial
    statement QA, achieves competitive accuracy on the ViFinQA benchmark by
    combining deterministic metadata routing, multi-stage progressive table
    filtering (hybrid retrieval → cross-encoder reranking → concept-coverage-matrix
    selection), AST-governed code synthesis with domain semantic validation, and
    sandboxed microVM execution — while providing full answer provenance linking
    every result to its source documents, table references, and executable code.
  novelty_type: "new-method"
  gap_evidence: >
    Existing financial QA systems either (a) use text-to-SQL, which is limited
    for file-based heterogeneous table structures common in OCR'd financial
    statements; (b) generate code as a single-shot task without grounded planning
    or deterministic retrieval bounding; or (c) lack traceable evidence provenance.
    No prior system combines deterministic metadata routing, accounting-role-aware
    table selection, AST-governed financial code synthesis, and sandboxed execution
    in an integrated pipeline for Vietnamese financial QA.

secondary_claims:
  - statement: >
      A two-stage LLM selection mechanism with an explicit concept coverage matrix
      (requiring accounting roles: direct, numerator, denominator, beginning_balance,
      ending_balance, comparison_operand) significantly improves table selection
      precision for multi-table financial calculations over standard top-k reranking.
    supports_primary: true

  - statement: >
      Combining AST-level code linting with domain-specific semantic validation
      (unit scale normalization for VND/million/billion conventions, rounding
      control, metadata isolation guards) reduces LLM code generation errors in
      financial calculations compared to unconstrained generation with execution
      feedback alone.
    supports_primary: true

  - statement: >
      An offline pipeline that automatically classifies Vietnamese financial
      statements across four regulatory entity domains (standard enterprises,
      credit institutions, securities companies, insurance companies) and induces
      accounting taxonomies from OCR text enables effective retrieval without
      expensive LLM-based annotation.
    supports_primary: true

non_claims:
  - "The system does not claim to handle arbitrary free-text financial questions outside the ViFinQA benchmark scope"
  - "The system does not propose novel LLM architectures or training methods; it uses off-the-shelf models"
  - "The system does not claim multilingual generalization beyond Vietnamese financial statements"
  - "The paper does not propose the sandboxed execution mechanism as a novel research contribution; it is described as an engineering design decision"
  - "The paper does not claim superiority over vision-language model approaches for document understanding"

risks:
  - description: >
      The ViFinQA benchmark is relatively new and may have limited community adoption,
      reducing the comparability of reported results with established benchmarks
      (FinQA, TAT-QA).
    mitigation: >
      Position ViFinQA within the broader financial QA benchmark landscape and
      provide qualitative comparison of task characteristics. Discuss how the
      system's design principles generalize beyond ViFinQA.

  - description: >
      The system relies on off-the-shelf LLMs accessed via API, making results
      sensitive to model version, temperature, and provider-specific behavior.
    mitigation: >
      Report exact model configurations, fix random seeds where possible, and
      run multiple evaluation passes. Discuss sensitivity analysis.

  - description: >
      The multi-stage pipeline (7+ stages) may be perceived as over-engineered
      compared to simpler end-to-end approaches.
    mitigation: >
      Provide ablation studies demonstrating the contribution of each stage.
      Show that simpler configurations (e.g., removing reranking, removing
      concept coverage, removing AST validation) degrade accuracy.

  - description: >
      OCR quality of input financial statements is variable, and the system's
      performance may degrade on low-quality OCR inputs.
    mitigation: >
      Document OCR preprocessing and error recovery heuristics. Report
      performance across different OCR quality levels if data is available.

reviewer_objections:
  - objection: >
      Why pandas code generation instead of SQL? SQL is more mature and has
      established benchmarks.
    preemptive_response: >
      Vietnamese financial statements are typically available as OCR-extracted
      text/HTML files, not relational databases. Pandas provides a natural
      interface for in-memory tabular computation over heterogeneous CSV files
      with variable schemas, complex row-label indexing, and multi-column
      arithmetic — operations that are awkward or impossible in standard SQL.
      The text-to-pandas paradigm also enables richer programmatic expressions
      (conditional logic, iterative filtering, unit conversions) that financial
      calculations frequently require.

  - objection: >
      The concept coverage matrix adds complexity. Is it really necessary, or
      does standard reranking suffice?
    preemptive_response: >
      Standard reranking optimizes relevance scoring but cannot verify
      computational completeness. A question like "What is the debt-to-equity
      ratio in 2023?" requires both a total-debt table and a total-equity table.
      A reranker might correctly rank both tables highly individually, but cannot
      guarantee both are selected. The concept coverage matrix explicitly models
      this requirement by mapping each selected table to its computational role,
      ensuring the full operand set is covered before code generation begins.

  - objection: >
      How does the system handle questions requiring information not present in
      any indexed table?
    preemptive_response: >
      The system is designed for the ViFinQA benchmark where all answers are
      derivable from the provided financial statements. The bounded retry loop
      (up to max_attempts) with structured feedback handles cases where initial
      code generation fails. Questions that cannot be answered from available
      tables are reported as failures with diagnostic traces, not hallucinated.

  - objection: >
      The evaluation is limited to a single benchmark (ViFinQA). How generalizable
      are the results?
    preemptive_response: >
      While the evaluation uses ViFinQA, the system's architectural principles
      (deterministic metadata routing, concept coverage verification, AST-governed
      synthesis, sandboxed execution) are domain-general and applicable to other
      financial QA tasks. We discuss generalization directions in the paper.

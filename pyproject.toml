[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finlens-ai"
version = "0.1.0"
description = "Reproducible retrieval-to-pandas pipeline for ViFinQA"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "e2b==2.26.0",
    "e2b-code-interpreter>=1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ijson>=3.3.0,<4.0.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=5.1.0,<6.0.0",
    "transformers>=4.57.3,<6.0.0",
    "tqdm>=4.60.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0,<1.0.0",
]

[tool.setuptools]
packages = { find = { include = ["src*"] } }

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "ViFinQA",
    "data",
    "metadata",
    "submission",
    "val_submission",
    "graphify-out",
    "src/graphify-out",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
